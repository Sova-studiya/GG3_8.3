<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-LAB · Special Questions Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120f26; --card:#1d1940; --card2:#262152; --line:rgba(255,255,255,.09);
  --text:#f3f1ff; --muted:#a9a3d6;
  --q:#ff4fa3; --a:#c6ff3d; --s:#3de0ff; --v:#ffb23d; --x:#e6e2ff;
  --ok:#3dffa0; --bad:#ff5c6c;
  --shadow:0 6px 0 #08061a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Manrope,system-ui,sans-serif;color:var(--text);background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 10%,rgba(255,79,163,.16),transparent 40%),
    radial-gradient(circle at 85% 30%,rgba(61,224,255,.13),transparent 40%),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3,.uf{font-family:Unbounded,sans-serif}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-family:Unbounded;font-weight:800;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .flask{width:34px;height:34px;border-radius:10px;background:var(--a);color:#120f26;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 0 #6f9a00}
.spacer{flex:1}
.pill{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center}
.pill.btn{cursor:pointer}
.pill.btn:hover{background:var(--card2)}
.combo{color:var(--v)}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:Unbounded;font-weight:700;font-size:16px;padding:15px 24px;border-radius:16px;background:var(--a);color:#120f26;box-shadow:0 5px 0 #6f9a00;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #6f9a00}
.big.ghost{background:var(--card2);color:var(--text);box-shadow:0 5px 0 #0a0820}
.big.pink{background:var(--q);color:#fff;box-shadow:0 5px 0 #a3195f}
.big:disabled{opacity:.4;pointer-events:none}

/* hero */
.hero h1{font-size:clamp(24px,5vw,38px);line-height:1.15;margin-bottom:10px}
.hero h1 span{color:var(--a)}
.hero p{color:var(--muted);font-size:16px;line-height:1.5;max-width:600px}
.namebox{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.namebox input{flex:1;min-width:180px}
input[type=text]{font-family:Manrope;font-size:18px;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#120f26;color:var(--text);outline:none}
input[type=text]:focus{border-color:var(--s)}

/* formula */
.formula{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.fslot{border-radius:16px;padding:12px 8px;text-align:center;color:#120f26;font-weight:800}
.fslot .l{font-size:22px;font-family:Unbounded}
.fslot .n{font-size:12px;opacity:.85;margin-top:2px;line-height:1.2}
.fslot .e{margin-top:8px;background:rgba(0,0,0,.15);border-radius:10px;padding:5px;font-size:15px}
.fq{background:var(--q);color:#fff}.fa{background:var(--a)}.fs{background:var(--s)}.fv{background:var(--v)}
.mnem{font-size:15px;color:var(--muted);text-align:center}
.mnem b{color:var(--text)}

/* missions */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:18px}
.mission{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:transform .12s;position:relative;overflow:hidden}
.mission:hover{transform:translateY(-3px)}
.mission .num{font-family:Unbounded;font-size:12px;color:var(--muted);letter-spacing:1px}
.mission h3{font-size:17px;margin:6px 0 6px}
.mission p{font-size:14px;color:var(--muted);line-height:1.4}
.mission .port{margin-bottom:12px}
.mission .port:only-child{margin:0}
.mission{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.mission .stars{margin-top:auto;padding-top:10px;font-size:18px;letter-spacing:2px}
.mission.boss{background:linear-gradient(135deg,#3a1146,#1d1940);border-color:rgba(255,79,163,.4)}
.sect{font-family:Unbounded;font-size:13px;color:var(--muted);letter-spacing:1.5px;margin:26px 0 4px;text-transform:uppercase}

/* game */
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:var(--card);border:1px solid var(--line);width:44px;height:44px;border-radius:14px;font-size:20px}
.prog{flex:1;height:14px;background:var(--card);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--s),var(--a));border-radius:999px;transition:width .4s}
.tlabel{font-family:Unbounded;font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--card2);color:var(--text);letter-spacing:0;text-transform:none;font-family:Manrope}
.chip.rq{background:rgba(255,178,61,.18);color:var(--v)}
.statement{font-size:18px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.statement b,.statement .tgt{color:#fff;background:rgba(255,230,0,.18);border-bottom:3px solid #ffe600;padding:0 4px;border-radius:4px}
.qframe{font-size:clamp(22px,4.5vw,30px);font-weight:800;line-height:1.4;margin:6px 0 20px}
.blank{display:inline-block;min-width:80px;text-align:center;border-bottom:4px dashed var(--a);color:var(--a);padding:0 6px;transition:.2s}
.blank.ok{border-bottom-style:solid;color:var(--ok);border-color:var(--ok)}
.blank.bad{color:var(--bad);border-color:var(--bad)}

.auxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aux{font-family:Unbounded;font-size:20px;font-weight:700;padding:16px 4px;border-radius:16px;background:var(--card2);box-shadow:0 5px 0 #0a0820;transition:transform .08s,background .15s}
.aux:active{transform:translateY(4px);box-shadow:0 1px 0 #0a0820}
.aux.r1{border-bottom:3px solid var(--q)}.aux.r2{border-bottom:3px solid var(--s)}.aux.r3{border-bottom:3px solid var(--v)}
.auxrow-l{font-size:11px;color:var(--muted);grid-column:1/-1;margin-top:4px;font-weight:700}

.ok-bg{background:var(--ok)!important;color:#0a2a1a!important}
.bad-bg{background:var(--bad)!important;color:#fff!important}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* builder */
.answerline{min-height:72px;border:2px dashed rgba(255,255,255,.18);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;transition:.2s}
.answerline.ok{border-color:var(--ok);border-style:solid;background:rgba(61,255,160,.07)}
.answerline.bad{border-color:var(--bad);border-style:solid}
.answerline .ph{color:var(--muted);font-size:14px;padding-left:6px}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.tile{font-weight:800;font-size:18px;padding:12px 16px;border-radius:14px;color:#120f26;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.tile:active{transform:translateY(3px)}
.t-q{background:var(--q);color:#fff}.t-a{background:var(--a)}.t-s{background:var(--s)}.t-v{background:var(--v)}.t-x{background:var(--x)}
.mono .tile{background:#e6e2ff!important;color:#120f26!important}
.qmark{font-size:26px;font-weight:800;color:var(--muted)}
.toggle{background:var(--card2);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800}

/* options */
.opts{display:grid;gap:10px}
.opt{text-align:left;font-size:19px;font-weight:700;padding:16px 18px;border-radius:16px;background:var(--card2);box-shadow:0 5px 0 #0a0820;transition:transform .08s}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #0a0820}
.opt.dim{opacity:.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{font-size:15px;font-weight:800;margin:4px 0 10px;color:var(--text)}
.step span{color:var(--muted);font-weight:600}

/* feedback */
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.5;display:none}
.fb.show{display:block;animation:pop .3s}
.fb.good{background:rgba(61,255,160,.12);border:1px solid rgba(61,255,160,.35)}
.fb.oops{background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.35)}
.fb .h{font-family:Unbounded;font-weight:700;font-size:15px;margin-bottom:4px}
.fb .right{font-size:19px;font-weight:800;margin:6px 0}
.fb .why{color:#d9d5ff}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}
.cue{font-size:15px;color:var(--muted);margin-bottom:8px}
.dlg{font-size:19px;line-height:1.7;margin-bottom:14px}
.dlg .who{font-family:Unbounded;font-size:13px;color:var(--muted);margin-right:6px}
.typerow{display:flex;gap:10px;flex-wrap:wrap}
.typerow input{flex:1;min-width:220px}
.hintbtn{background:transparent;color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline;padding:8px 0;margin-top:8px}
.bugq{font-size:clamp(22px,4.5vw,30px);font-weight:800;text-align:center;padding:26px 10px;border-radius:18px;background:#120f26;border:2px solid var(--line);margin-bottom:16px}
.bugq s{color:var(--bad)}

/* colored words in explanations */
.cq{color:var(--q);font-weight:800}.ca{color:var(--a);font-weight:800}.cs{color:var(--s);font-weight:800}.cv{color:var(--v);font-weight:800}

/* tense cards */
.tenses{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.tcard{perspective:800px;height:130px;background:none}
.tin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.tcard.flip .tin{transform:rotateY(180deg)}
.tf,.tb{position:absolute;inset:0;border-radius:16px;padding:12px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;text-align:center;border:1px solid var(--line)}
.tf{background:var(--card2)}
.tf .tn{font-family:Unbounded;font-size:14px;font-weight:700}
.tf .tm{font-size:13px;color:var(--muted);margin-top:6px}
.tb{background:#120f26;transform:rotateY(180deg)}
.tb .hp{font-family:Unbounded;color:var(--a);font-size:16px;font-weight:700}
.tb .ex{font-size:14px;margin-top:6px;line-height:1.35}

/* who demo */
.demo-s{font-size:clamp(20px,4vw,28px);font-weight:800;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.wbtn{padding:10px 14px;border-radius:14px;background:var(--card2);font-size:inherit;font-weight:800;border:2px dashed rgba(255,255,255,.3)}
.wbtn:hover{border-color:#ffe600}
.demo-out{min-height:110px;background:#120f26;border-radius:16px;padding:16px;border:1px solid var(--line)}
.demo-out .res{font-size:clamp(20px,4vw,28px);font-weight:800;margin-bottom:8px}
.demo-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.demo-tabs button{padding:8px 12px;border-radius:999px;background:var(--card2);font-weight:800;font-size:13px}
.demo-tabs button.on{background:var(--s);color:#120f26}
.rule2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rule2>div{border-radius:16px;padding:14px;font-size:15px;line-height:1.45}
.r-s{background:rgba(61,224,255,.1);border:1px solid rgba(61,224,255,.35)}
.r-o{background:rgba(255,79,163,.1);border:1px solid rgba(255,79,163,.35)}
.rule2 h4{font-family:Unbounded;font-size:14px;margin-bottom:6px}

/* result */
.result{text-align:center}
.result .bigstars{font-size:54px;letter-spacing:6px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:#120f26;border-radius:16px;padding:14px 6px}
.stat b{display:block;font-family:Unbounded;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,26,.78);display:none;align-items:flex-start;justify-content:center;padding:20px;z-index:50;overflow:auto}
.modal.show{display:flex}
.modal .card{max-width:720px;width:100%;margin:auto}
.mtable{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
.mtable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mtable td:first-child{color:var(--muted);font-weight:700;white-space:nowrap}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:var(--v);color:#120f26;font-family:Unbounded;font-weight:700;padding:10px 18px;border-radius:999px;transition:transform .3s;z-index:60;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.port{width:72px;height:72px;border-radius:50%;background:#0c0a25;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.07),0 0 22px rgba(61,224,255,.16);transition:transform .2s}
.port img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);display:block}
.port.sm{width:42px;height:42px}
.port.pk{box-shadow:0 0 0 2px rgba(255,79,163,.5),0 0 26px rgba(255,79,163,.35)}
.mission:hover .port{transform:rotate(-6deg) scale(1.06)}
.fade{-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 70%);mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 70%)}
.herogrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.botwrap{position:relative;width:170px;height:170px}
.botwrap::before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,#0c0a25 55%,rgba(12,10,37,0) 72%);box-shadow:0 0 60px rgba(198,255,61,.12)}
.botwrap img{position:relative;width:100%;height:100%;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bubble{position:absolute;top:-6px;left:-70px;background:#fff;color:#120f26;font-weight:800;font-size:13px;padding:8px 12px;border-radius:14px 14px 4px 14px;white-space:nowrap;box-shadow:var(--shadow);animation:pop .5s}
.fbrow{display:flex;gap:12px;align-items:flex-start}
.ava{width:64px;height:64px;flex:none;margin-top:-4px}
.fb.good .ava{animation:pop .4s}
.resbot{width:150px;height:150px;margin:0 auto -6px;display:block;animation:float 3s ease-in-out infinite}
.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.foot{margin-top:30px;color:var(--muted);font-size:13px;line-height:1.5}
@media (max-width:560px){
  .herogrid{grid-template-columns:1fr}
  .botwrap{width:130px;height:130px;margin:0 auto;order:-1}
  .bubble{left:auto;right:-60px;top:-4px}
  .ava{width:52px;height:52px}
  .top{gap:6px;flex-wrap:nowrap}
  .logo{font-size:16px}.logo .flask{width:30px;height:30px;font-size:15px}
  .pill{padding:7px 9px;font-size:13px}
  #agentPill{display:none!important}
  .xpl{display:none}
  .formula{grid-template-columns:repeat(2,1fr)}
  .rule2,.two{grid-template-columns:1fr}
  .card{padding:16px}
  .aux{font-size:17px;padding:14px 2px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo" onclick="go('home')"><div class="flask">⚗</div>Q-LAB</div>
    <div class="spacer"></div>
    <div class="pill" id="agentPill" style="display:none">🕶 <span id="agentName"></span></div>
    <div class="pill combo" id="comboPill" style="display:none">🔥 <span id="comboN">0</span></div>
    <div class="pill">⚡ <span id="xp">0</span><span class="xpl"> XP</span></div>
    <div class="pill btn" onclick="openCheat()" title="Шпаргалка">📋</div>
    <div class="pill btn" id="sndBtn" onclick="toggleSound()" title="Звук">🔊</div>
  </div>
  <div id="app"></div>
</div>

<div class="modal" id="cheat" onclick="if(event.target===this)closeCheat()">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:20px">📋 Шпаргалка</h2><button class="back" onclick="closeCheat()">✕</button></div>
    <div id="cheatBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const TENSE = {
  PS:{n:'Present Simple',m:'every day, often, usually',h:'do / does',ex:'Where <span class="ca">does</span> she live?',why:'Present Simple → <span class="ca">do</span> / <span class="ca">does</span> (he, she, it → does). Глагол в 1-й форме, без -s.'},
  PC:{n:'Present Continuous',m:'now, at the moment, today',h:'am / is / are + -ing',ex:'Why <span class="ca">are</span> you laugh<b>ing</b>?',why:'Present Continuous → <span class="ca">am / is / are</span> + глагол<b>-ing</b>.'},
  PaS:{n:'Past Simple',m:'yesterday, ago, last week',h:'did',ex:'Who <span class="ca">did</span> you call?',why:'Past Simple → <span class="ca">did</span>. Глагол возвращается в 1-ю форму: went → go, called → call.'},
  PaC:{n:'Past Continuous',m:'at 5 p.m. yesterday, when…',h:'was / were + -ing',ex:'What <span class="ca">were</span> you do<b>ing</b>?',why:'Past Continuous → <span class="ca">was / were</span> + глагол<b>-ing</b>.'},
  W:{n:'Future: will',m:'tomorrow, one day, in 10 years',h:'will',ex:'Where <span class="ca">will</span> you live?',why:'Будущее → <span class="ca">will</span> + глагол в 1-й форме.'},
  G:{n:'be going to',m:'планы и намерения',h:'am / is / are + going to',ex:'When <span class="ca">are</span> you going to open it?',why:'Планы → <span class="ca">am / is / are</span> + going to + глагол.'}
};

// Mission 1 – helper hunt
const HELPER = [
 {st:'Mrs Q is staying with Doctor Q.',q:'Why ___ Mrs Q staying with him?',a:'is',t:'PC'},
 {st:'Doctor Q works in his lab every day.',q:'Where ___ Doctor Q work?',a:'does',t:'PS'},
 {st:'Rob and Millie went to the park yesterday.',q:'Where ___ Rob and Millie go yesterday?',a:'did',t:'PaS'},
 {st:"I'm calling Doctor Spark.",q:'Who ___ you calling?',a:'are',t:'PC'},
 {st:'Millie was making breakfast at 8 a.m.',q:'What ___ Millie doing at 8 a.m.?',a:'was',t:'PaC'},
 {st:'Doctor Q will rest at four o\'clock.',q:'When ___ Doctor Q rest?',a:'will',t:'W'},
 {st:'Rob and Pi are going to travel to the Arctic.',q:'Where ___ Rob and Pi going to travel?',a:'are',t:'G'},
 {st:'My friends play Minecraft after school.',q:'When ___ your friends play Minecraft?',a:'do',t:'PS'},
 {st:'Mrs Q called her son last night.',q:'Who ___ Mrs Q call last night?',a:'did',t:'PaS'},
 {st:'The kids were watching a film at 6 p.m.',q:'What ___ the kids watching at 6 p.m.?',a:'were',t:'PaC'},
 {st:"She's going to buy new trainers.",q:'What ___ she going to buy?',a:'is',t:'G'},
 {st:"I'll live in Berlin one day.",q:'Where ___ you live one day?',a:'will',t:'W'},
 {st:'Pi gets up at 7 o\'clock.',q:'What time ___ Pi get up?',a:'does',t:'PS'},
 {st:"I'm going to be a famous blogger.",q:'What ___ you going to be?',a:'am',t:'G'},
 {st:'Doctor Q slept for two hours.',q:'How many hours ___ Doctor Q sleep?',a:'did',t:'PaS'},
 {st:'Doctor Q was sleeping when the phone rang.',q:'What ___ Doctor Q doing when the phone rang?',a:'was',t:'PaC'}
];

// Mission 2 – builder.  role: q a s v x
const BUILD = [
 {w:'What:q|was:a|Doctor Q:s|doing:v|at eleven o\'clock:x',t:'PaC',d:'were:a'},

let G=null; // current game
let combo=0;

const $=id=>document.getElementById(id);
const app=$('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function upd(){
  $('xp').textContent=S.xp;
  $('agentPill').style.display=S.name?'flex':'none';$('agentName').textContent=S.name;
  $('comboPill').style.display=combo>=2?'flex':'none';$('comboN').textContent='x'+combo;
  $('sndBtn').textContent=S.sound?'🔊':'🔇';
}

  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq = type==='ok'?[[660,.0],[880,.08]] : type==='bad'?[[220,0],[170,.1]] : type==='win'?[[523,0],[659,.1],[784,.2],[1046,.3]] : [[500,0]];
    seq.forEach(([f,t])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,AC.currentTime+t);
      g.gain.exponentialRampToValueAtTime(type==='tap'?.05:.15,AC.currentTime+t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.16);
      o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.18);
    });
  }catch(e){}
}

/* ============ GAME ENGINE ============ */
function start(id){
  const m=MISSIONS.find(x=>x.id===id);
  let items;
  if(m.type==='mix'){
    const mk=(pool,type,n)=>shuffle(pool).slice(0,n).map(x=>({...x,_type:type}));
    items=shuffle([...mk(HELPER,'helper',3),...mk(BUILD,'build',3),...mk(WHO,'who',3),...mk(TYPE,'type',2),...mk(BUG,'bug',3)]);
  } else items=shuffle(m.pool).slice(0,m.take).map(x=>({...x,_type:m.type}));
  G={m,queue:items,base:items.length,done:0,first:0,firstTotal:items.length,fixed:0,xp0:S.xp};
  combo=0;upd();
  if(m.intro==='whoDemo') whoDemo(); else next();
}
function next(){
  window.scrollTo(0,0);
  if(!G.queue.length) return finish();
  G.cur=G.queue.shift();G.answered=false;
  const it=G.cur;
  const pct=Math.round(G.done/(G.done+G.queue.length+1)*100);
  app.innerHTML=`
   <div class="ghead"><button class="back" onclick="go('home')">←</button>
   <div class="prog"><i style="width:${pct}%"></i></div>
   ${port(G.m.img,'sm')}</div>
   <div class="card" id="task"></div>`;
  ({helper:rHelper,build:rBuild,who:rWho,type:rType,bug:rBug})[it._type](it,$('task'));
}
function result(correct,fbHTML,auto){
  const it=G.cur;if(G.answered) return;G.answered=true;
  const firstTime=!it._retry;
  if(correct){
    combo++;let gain=firstTime?10:5;
    if(combo>=3) gain+=Math.min(combo,8);
    S.xp+=gain;if(firstTime) G.first++; else G.fixed++;
    beep('ok');
    if(combo===3||combo===5||combo===10) toast(`🔥 Комбо x${combo}!`);
  } else {
    combo=0;beep('bad');
    G.queue.push({...it,_retry:true});
  }
  G.done++;save();upd();
  const fb=document.createElement('div');
  fb.className='fb show '+(correct?'good':'oops');
  fb.innerHTML=`<div class="fbrow"><img class="ava fade" src="${correct?IMG.bot_yay:IMG.bot_hmm}" alt=""><div style="flex:1;min-width:0"><div class="h">${correct?pick(PRAISE):pick(OOPS)}</div>${fbHTML||''}${!correct?'<div style="margin-top:8px;font-size:13px;color:var(--v)">↻ Это задание вернётся в конце миссии</div>':''}</div></div>`;
  const task=$('task');task.appendChild(fb);
  const nr=document.createElement('div');nr.className='nextrow';
  nr.innerHTML=`<button class="big" id="nextBtn">Дальше →</button>`;
  task.appendChild(nr);
  $('nextBtn').onclick=()=>{beep('tap');next()};
  setTimeout(()=>{ $('nextBtn')&&$('nextBtn').focus({preventScroll:true}); fb.scrollIntoView({behavior:'smooth',block:'nearest'}); },50);
}

/* ---------- 2 builder ---------- */
function parseTiles(s){return s.split('|').map(p=>{const i=p.lastIndexOf(':');return{w:p.slice(0,i),r:p.slice(i+1)}})}
function rBuild(it,el){
  const correct=parseTiles(it.w);
  let pool=shuffle([...correct,...(it.d?parseTiles(it.d):[])]).map((t,i)=>({...t,id:i}));
  let ans=[];
  function draw(){
    el.innerHTML=`
     <div class="tlabel">Собери вопрос ${retryChip(it)} <span class="spacer" style="flex:1"></span>
       <button class="toggle" id="tg">${S.mono?'🎨 Цвета: выкл (хард)':'🎨 Цвета: вкл'}</button></div>
     <div class="answerline ${S.mono?'mono':''}" id="al">${ans.length?ans.map(t=>`<button class="tile t-${t.r}" data-id="${t.id}">${t.w}</button>`).join(''):'<span class="ph">Нажимай на кусочки по порядку: В → П → К → Г</span>'}<span class="qmark">?</span></div>
     <div class="pool ${S.mono?'mono':''}">${pool.filter(t=>!ans.includes(t)).map(t=>`<button class="tile t-${t.r}" data-id="${t.id}">${t.w}</button>`).join('')}</div>
     <div class="nextrow" style="justify-content:space-between"><button class="big ghost" id="clr">Сброс</button><button class="big" id="chk" ${ans.length?'':'disabled'}>Проверить</button></div>`;
    el.querySelectorAll('.pool .tile').forEach(b=>b.onclick=()=>{if(G.answered)return;beep('tap');ans.push(pool.find(t=>t.id==b.dataset.id));draw()});
    el.querySelectorAll('#al .tile').forEach(b=>b.onclick=()=>{if(G.answered)return;ans=ans.filter(t=>t.id!=b.dataset.id);draw()});
    $('tg').onclick=()=>{S.mono=!S.mono;save();draw()};
    $('clr').onclick=()=>{if(G.answered)return;ans=[];draw()};
    $('chk').onclick=check;
  }
  function check(){
    if(G.answered) return;
    const ok=ans.map(t=>t.w).join(' ')===correct.map(t=>t.w).join(' ');
    $('al').classList.add(ok?'ok':'bad',ok?'pop':'shake');
    el.querySelector('.nextrow').remove();
    el.querySelectorAll('.pool .tile').forEach(b=>b.style.opacity=.3);
    const colored=correct.map(t=>`<span class="c${t.r==='x'?'x':t.r}">${t.w}</span>`).join(' ')+'?';
    const t=TENSE[it.t];
    let extra='';
    if(!ok&&it.d){const d=parseTiles(it.d)[0];if(ans.some(a=>a.w===d.w)) extra=`<div class="why" style="margin-top:6px">Лишняя деталь была <b>«${d.w}»</b> — в вопрос её брать нельзя.</div>`}
    result(ok,`${ok?'':`<div class="right">${colored}</div>`}<div class="why"><span class="chip">${t.n}</span> ${t.why}</div>${extra}`);
  }
  draw();
}

const CONTR={"what's":'what is',"who's":'who is',"where's":'where is',"i'm":'i am',"you're":'you are',"they're":'they are',"we're":'we are',"she's":'she is',"he's":'he is',"it's":'it is',"i'll":'i will',"you'll":'you will',"won't":'will not',"don't":'do not',"doesn't":'does not',"didn't":'did not',"isn't":'is not',"aren't":'are not',"wasn't":'was not',"weren't":'were not'};
function norm(s){
  s=' '+s.toLowerCase().replace(/[’`´]/g,"'")+' ';
  for(const k in CONTR) s=s.split(k).join(CONTR[k]);
  return s.replace(/'/g,'').replace(/[?!.,;:]/g,'').replace(/\s+/g,' ').trim();
}
const PAST=['went','saw','ate','came','took','made','gave','woke','called','invited','visited','played','arrived','slept','wanted','lived','got'];

   <button class="hintbtn" id="hint">💡 Покажи начало</button>`;
  const inp=$('inp');setTimeout(()=>inp.focus({preventScroll:true}),100);
  $('hint').onclick=()=>{const start=it.subj?`${cap(it.qw)}…`:`${cap(it.qw)} ${it.aux}…`;$('hint').outerHTML=`<div class="cue" style="margin-top:8px">Начало: <b class="cq">${start}</b> ${it.subj?'<span style="color:var(--muted)">(помощник тут не нужен!)</span>':''}</div>`};
  const check=()=>{
    if(G.answered) return;
    const u=norm(inp.value);if(!u){inp.focus();return}
    const ok=it.acc.includes(u);
    inp.disabled=true;inp.style.borderColor=ok?'var(--ok)':'var(--bad)';inp.classList.add(ok?'pop':'shake');
    $('chk').remove();const h=$('hint');if(h)h.remove();
    let diag='';
    if(!ok){
      const tk=u.split(' '),qwN=it.qw.split(' ').length;
      if(it.subj&&tk.some(w=>['did','does','do'].includes(w))) diag='Who здесь = КТО сделал (подлежащее) → <b>помощник не нужен</b>, глагол как в утверждении.';
      else if(it.aux&&!tk.includes(it.aux)) diag=`Не хватает помощника <span class="ca">${it.aux}</span>. ${guessTense(it.aux)}`;
      else if(it.aux&&tk[qwN]!==it.aux) diag=`Помощник <span class="ca">${it.aux}</span> стоит сразу после вопросительного слова, <b>перед</b> подлежащим (В-П-К-Г).`;
      else if(tk.includes('did')&&tk.some(w=>PAST.includes(w))) diag='После <span class="ca">did</span> глагол в 1-й форме, без -ed.';
      else if(tk.includes('does')&&tk.some((w,i)=>i>qwN+1&&/[^s]s$/.test(w)&&w!=='games'&&w!=='this')) diag='После <span class="ca">does</span> глагол без -s.';
      else diag='Сравни свой вариант с правильным — где отличие?';
    }
    const right=cap(it.acc[0])+'?';
    result(ok,ok?`<div class="why">${cap(it.acc[0])}? — именно так.</div>`:`<div class="why">Ты написал: <s style="opacity:.7">${esc(inp.value)}</s></div><div class="right">${right}</div><div class="why">${diag}</div>`);
  };
  $('chk').onclick=check;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!G.answered)check();else $('nextBtn').click()}});
}
function cap(s){return s.replace(/\bmrs q\b/g,'Mrs Q').replace(/\bdoctor q\b/g,'Doctor Q').replace(/\bpoppy\b/g,'Poppy').replace(/\b5 pm\b/,'5 p.m.').replace(/^./,c=>c.toUpperCase())}
function guessTense(a){return({do:'Present Simple → do.',does:'Present Simple, он/она → does.',did:'Past Simple → did.',am:'Continuous / going to → am.',is:'Continuous / going to → is.',are:'Continuous / going to → are.',was:'Past Continuous → was.',were:'Past Continuous → were.',will:'Будущее → will.'})[a]||''}

/* ---------- 5 bug ---------- */
function rBug(it,el){
  el.innerHTML=`
   <div class="tlabel">Баг-хантер ${retryChip(it)}</div>
   <div class="bugq" id="bq">${it.q}</div>
   <div class="two"><button class="opt" data-v="1" style="text-align:center">✔ Всё ок</button><button class="opt" data-v="0" style="text-align:center">🐞 Есть баг</button></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.answered) return;
    const said=b.dataset.v==='1',ok=said===it.ok;
    b.classList.add(ok?'ok-bg':'bad-bg',ok?'pop':'shake');
    if(!it.ok) $('bq').innerHTML=`<s>${it.q}</s><div style="margin-top:10px;font-size:.9em">${it.fix}</div>`;
    else $('bq').style.borderColor='var(--ok)';
    result(ok,`<div class="why">${it.ok?'В этом вопросе ошибок нет. ':'<b>Баг!</b> '}${it.why}</div>`);
  });
}

/* ---------- finish ---------- */
function finish(){
  const acc=G.first/G.firstTotal;
  const st=acc>=.9?3:acc>=.7?2:1;
  const prev=S.stars[G.m.id]||0;
  if(st>prev) S.stars[G.m.id]=st;
  save();upd();beep('win');if(st>=2)confetti();
  const idx=MISSIONS.indexOf(G.m),nxt=MISSIONS[idx+1];
  const msg= st===3?'Тема у тебя в кармане. Доктор Q гордится!':st===2?'Крепко! Ещё один заход — и будет три звезды.':'Ты разобрал все ловушки — это и есть обучение. Пройди ещё раз, будет заметно легче.';
  app.innerHTML=`
  <div class="card result">
    <img class="resbot fade" src="${st>=2?IMG.bot_yay:IMG.bot_hmm}" alt="">
    <div class="tlabel" style="justify-content:center">Миссия завершена</div>
    <h2 style="font-size:24px">${G.m.title}</h2>
    <div class="bigstars">${stars(st)}</div>
    <p style="color:var(--muted)">${msg}</p>
    <div class="stats">
      <div class="stat"><b>${G.first}/${G.firstTotal}</b><span>с первой попытки</span></div>
      <div class="stat"><b>${G.fixed}</b><span>ошибок исправлено</span></div>
      <div class="stat"><b>+${S.xp-G.xp0}</b><span>XP</span></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="big ghost" onclick="start('${G.m.id}')">↻ Ещё раз</button>
      ${nxt?`<button class="big ${nxt.boss?'pink':''}" onclick="start('${nxt.id}')">${nxt.boss?'💥 К боссу':'Следующая миссия'} →</button>`:`<button class="big" onclick="go('home')">На базу</button>`}
    </div>
  </div>`;
}

  $('cheatBody').innerHTML=formulaHTML()+`
   <table class="mtable">${Object.values(TENSE).map(t=>`<tr><td>${t.n}</td><td><span class="ca">${t.h}</span></td><td>${t.ex}</td></tr>`).join('')}</table>
   ${whoRuleHTML()}`;
  $('cheat').classList.add('show');
}
function closeCheat(){$('cheat').classList.remove('show')}

upd();home();
